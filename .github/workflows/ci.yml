name: Firmware CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Build ESP8266 firmware
        run: pio run -e feather_huzzah_esp8266
      - name: Run native unit tests
        run: pio test -e native
      - name: Upload firmware binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp-nmos-tally-esp8266-firmware
          path: .pio/build/feather_huzzah_esp8266/firmware.bin
          if-no-files-found: error
      - name: Check tracked-file whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
