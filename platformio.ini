; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = feather_huzzah_esp8266

[env]
build_flags =
	-std=gnu++17
	-D TALLY_LED_COUNT=32
lib_deps =
	adafruit/Adafruit NeoPixel@1.12.3

[env:feather_huzzah_esp8266]
platform = espressif8266@4.2.1
board = huzzah
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
platform_packages = platformio/tool-mkspiffs@~1.200.0
build_flags =
	${env.build_flags}
	-D TALLY_LED_PIN=2

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_wokwi.csv
build_flags =
	${env.build_flags}
	-D TALLY_LED_PIN=18

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
	-std=gnu++17
	-I include
test_build_src = yes
build_src_filter =
	+<tally/TallyState.cpp>
	+<config/DeviceConfig.cpp>
	+<config/ConfigRecord.cpp>
	+<config/ConfigRecovery.cpp>
	+<network/ConnectionState.cpp>
	+<security/ProvisioningAuth.cpp>
	+<serial/SerialDiagnostics.cpp>
	+<web/RequestValidation.cpp>
	+<platform/BoardConfiguration.cpp>
platform_packages = platformio/tool-mkspiffs@~1.200.0
