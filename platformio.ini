[platformio]
default_envs = feather_huzzah_esp8266

[env]
build_flags =
    -std=gnu++17
    -D TALLY_LED_PIN=15
    -D TALLY_LED_COUNT=32
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

[env:feather_huzzah_esp8266]
platform = espressif8266
board = huzzah
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I include
test_build_src = yes
build_src_filter =
    +<tally/TallyState.cpp>
    +<config/DeviceConfig.cpp>
